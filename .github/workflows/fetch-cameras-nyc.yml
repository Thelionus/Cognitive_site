name: Fetch Cameras NYC

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy fetcher script
        run: |
          git fetch origin main
          git checkout origin/main -- fetch-cameras-nyc.js

      - name: Fetch cameras
        run: node fetch-cameras-nyc.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cameras-nyc.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update NYC cameras"
          git push origin data
