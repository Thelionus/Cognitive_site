name: Debug NYC Camera Real Browser

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run real-browser probe against production
        run: node debug-nyc-camera-realbrowser.js
      - name: Upload popup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-popup-screenshot
          path: camera-popup.png
          if-no-files-found: ignore
