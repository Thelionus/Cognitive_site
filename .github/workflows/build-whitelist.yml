name: Build Whitelist

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday 6am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy builder script
        run: |
          git fetch origin main
          git checkout origin/main -- build-whitelist.js

      - name: Build whitelist
        run: node build-whitelist.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whitelist.json
          git diff --staged --quiet || git commit -m "chore: update whitelist"
          git push origin data
