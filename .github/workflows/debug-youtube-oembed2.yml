name: Debug YouTube oEmbed (temporary)

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: 'Comma-separated YouTube video IDs to check (ignored if channel_handle is set)'
        required: false
        default: 'iJxeutc3QCI'
      channel_handle:
        description: 'YouTube @handle to resolve to a channel ID (e.g. @mooreequipmentltd.3428)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve channel handle
        if: ${{ github.event.inputs.channel_handle != '' }}
        run: node debug-youtube-oembed2.js --channel "${{ github.event.inputs.channel_handle }}"
      - name: Check oEmbed for each video ID
        if: ${{ github.event.inputs.channel_handle == '' }}
        run: |
          IFS=',' read -ra IDS <<< "${{ github.event.inputs.video_ids }}"
          for id in "${IDS[@]}"; do
            echo "=== $id ==="
            node debug-youtube-oembed2.js "$id"
          done
