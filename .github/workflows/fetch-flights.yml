name: Fetch Flights

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy fetcher script
        run: |
          git fetch origin main
          git checkout origin/main -- fetch-flights.js

      - name: Fetch ADS-B data
        run: node fetch-flights.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flights.json
          git diff --staged --quiet || git commit -m "chore: update flights"
          git push origin data
